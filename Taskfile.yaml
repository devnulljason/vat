# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  build:
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - exclude: "**/*_test.go"
    generates:
      - build/vat{{exeExt}}
    cmd: go build -o build/vat{{exeExt}} .

  doc:
    cmd: go doc -http

  format:
    aliases:
      - fmt
    cmd: golangci-lint fmt --diff-colored

  lint:
    cmd: golangci-lint run

  run:
    deps: [build]
    dir: build
    cmd: ./vat{{exeExt}}

  test:
    cmd: go tool gotestsum --format=testdox --format-icons=octicons

  vulncheck:
    cmd: go tool govulncheck -show=color ./...
