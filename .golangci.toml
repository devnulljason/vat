version = "2"

[linters]
default = "standard"
enable = [
  "embeddedstructfieldcheck",
  "errname",
  "funcorder",
  "godoclint",
  "godot",
  "gosec",
  "misspell",
  "modernize",
  "nakedret",
]

[linters.exclusions]
presets = ["std-error-handling", "common-false-positives"]

[[linters.exclusions.rules]]
path = '(.+)_test\.go'
linters = ["godoclint"]

[linters.settings.godoclint]
default = "basic"
enable = ["no-unused-link"]

[linters.settings.misspell]
locale = "US"

[formatters]
enable = ["gofumpt"]
